[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "rtl-lint"
version = "0.2.0"
description = "Catch left/right layout assumptions in Swift and storyboards before your Arabic users do."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Abdulluh.X", email = "199844698+hfip@users.noreply.github.com" }]
keywords = ["rtl", "arabic", "ios", "swift", "localization", "lint", "xcode", "storyboard"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Arabic",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Localization",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
rtl-lint = "rtl_lint.cli:main"

[project.urls]
Homepage = "https://github.com/hfip/rtl-lint"
Repository = "https://github.com/hfip/rtl-lint"
Issues = "https://github.com/hfip/rtl-lint/issues"
Changelog = "https://github.com/hfip/rtl-lint/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/rtl_lint"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
