<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="280" viewBox="0 0 1280 280" role="img" aria-label="rtl-lint marking a .left alignment on ruled paper">
  <title>rtl-lint marking a .left alignment on ruled paper</title>
  <rect width="1280" height="280" fill="#f7f3e9"/>

  <g stroke="#e6dfcd">
    <path d="M0 56h1280M0 96h1280M0 136h1280M0 176h1280M0 216h1280M0 256h1280"/>
  </g>
  <path d="M104 0v280" stroke="#e3b1a6"/>

  <text x="40" y="40" font-family="Georgia, 'Times New Roman', serif" font-size="15" letter-spacing="4" fill="#8a7f6b">RTL-LINT</text>
  <text x="40" y="262" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#a1937c" font-style="italic">a linter for the mirrored half of your UI</text>

  <text x="150" y="132" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="30" fill="#1f2937">label.textAlignment = <tspan fill="#b91c1c">.left</tspan></text>

  <path d="M538 146 q4.5 -9 9 0 t9 0 t9 0 t9 0 t9 0 t9 0 t9 0 t9 0 t9 0 t9 0"
        fill="none" stroke="#b91c1c" stroke-width="2.5" stroke-linecap="round"/>

  <rect x="664" y="96" width="104" height="30" rx="3" fill="#b91c1c"/>
  <text x="716" y="116" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#fdf6ea">RTL001</text>

  <text x="150" y="182" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-style="italic" fill="#9a3412">use .leading, it flips with the language</text>

  <g transform="rotate(-7 1010 150)">
    <text x="1010" y="150" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="21" font-style="italic" fill="#a8a29e">"looks fine in</text>
    <text x="1010" y="180" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="21" font-style="italic" fill="#a8a29e">English, though"</text>
  </g>
</svg>
