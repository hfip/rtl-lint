name: rtl-lint
description: Catch left/right layout assumptions in Swift and storyboards before your Arabic users do
author: Abdulluh.X

branding:
  icon: type
  color: purple

inputs:
  paths:
    description: Files or directories to scan
    required: false
    default: "."
  args:
    description: Extra rtl-lint flags, e.g. "--ignore RTL004 --exclude '**/Generated/**'"
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install rtl-lint
      shell: bash
      run: python -m pip install --quiet --disable-pip-version-check "$GITHUB_ACTION_PATH"

    - name: Run rtl-lint
      shell: bash
      env:
        RTL_LINT_PATHS: ${{ inputs.paths }}
        RTL_LINT_ARGS: ${{ inputs.args }}
      run: |
        # shellcheck disable=SC2086
        rtl-lint --format github --no-color $RTL_LINT_ARGS $RTL_LINT_PATHS
